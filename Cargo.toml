[package]
name = "gogdl"
version = "0.1.0"
edition = "2024"
description = "Download, configure, and run GOG games on Linux with Proton/Wine prefix management and cloud save sync"
license = "GPL-3.0-or-later"
repository = "https://github.com/fernandonr189/gogdl-cli"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
directories = "6.0.0"
gogdl-lib = { version = "0.8.0", git = "https://github.com/fernandonr189/gogdl-lib.git", tag = "v0.8.0" }
open = "5.3.3"
prefix-manager = { version = "0.1.0", git = "https://github.com/fernandonr189/prefix-manager.git", rev = "a4bd79ad3921b1ec8ec28d6c4f193c45a16435d8" }
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
console = "0.16.2"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Fernando Ismael Navarrete Ruiz"
copyright = "2026, Fernando Ismael Navarrete Ruiz"
section = "games"
priority = "optional"
extended-description = """\
gogdl downloads, configures, and runs GOG games on Linux. It manages \
Proton/Wine prefixes automatically and supports cloud save sync, with both \
an interactive menu and direct CLI flags for scripting."""
assets = [
    ["target/release/gogdl", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/gogdl/README.md", "644"],
]
